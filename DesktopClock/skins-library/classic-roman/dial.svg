<?xml version="1.0" encoding="UTF-8"?>
<!-- DesktopClock 表盘矢量源：经典罗马（米色 #f5e6d3 / 棕色刻度 #5c3a1e / 罗马数字） -->
<!-- viewBox 0 0 400 400，中心 (200,200)，外圈半径 180 -->
<!-- 可用 Inkscape / rsvg-convert 转为 1024x1024 PNG 后填入设置面板 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- 背景 -->
  <rect width="400" height="400" fill="#f5e6d3"/>

  <!-- 外圈 -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#5c3a1e" stroke-width="2"/>
  <!-- 内圈装饰 -->
  <circle cx="200" cy="200" r="172" fill="none" stroke="#5c3a1e" stroke-width="0.8" opacity="0.6"/>

  <!-- 刻度 -->
  <g stroke="#5c3a1e" stroke-linecap="butt">
    <!-- 整点刻度（12 个，每 30 度，更长更粗） -->
    <g stroke-width="3">
      <line x1="200" y1="20" x2="200" y2="42" transform="rotate(0 200 200)"/>
      <line x1="200" y1="20" x2="200" y2="42" transform="rotate(30 200 200)"/>
      <line x1="200" y1="20" x2="200" y2="42" transform="rotate(60 200 200)"/>
      <line x1="200" y1="20" x2="200" y2="42" transform="rotate(90 200 200)"/>
      <line x1="200" y1="20" x2="200" y2="42" transform="rotate(120 200 200)"/>
      <line x1="200" y1="20" x2="200" y2="42" transform="rotate(150 200 200)"/>
      <line x1="200" y1="20" x2="200" y2="42" transform="rotate(180 200 200)"/>
      <line x1="200" y1="20" x2="200" y2="42" transform="rotate(210 200 200)"/>
      <line x1="200" y1="20" x2="200" y2="42" transform="rotate(240 200 200)"/>
      <line x1="200" y1="20" x2="200" y2="42" transform="rotate(270 200 200)"/>
      <line x1="200" y1="20" x2="200" y2="42" transform="rotate(300 200 200)"/>
      <line x1="200" y1="20" x2="200" y2="42" transform="rotate(330 200 200)"/>
    </g>
    <!-- 分钟刻度（48 个，每 6 度，跳过整点） -->
    <g stroke-width="1">
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(6 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(12 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(18 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(24 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(36 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(42 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(48 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(54 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(66 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(72 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(78 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(84 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(96 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(102 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(108 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(114 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(126 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(132 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(138 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(144 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(156 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(162 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(168 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(174 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(186 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(192 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(198 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(204 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(216 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(222 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(228 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(234 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(246 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(252 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(258 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(264 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(276 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(282 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(288 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(294 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(306 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(312 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(318 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(324 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(336 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(342 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(348 200 200)"/>
      <line x1="200" y1="22" x2="200" y2="30" transform="rotate(354 200 200)"/>
    </g>
  </g>

  <!-- 罗马数字 I-XII -->
  <g fill="#5c3a1e" font-family="'Times New Roman', Times, serif" font-size="28" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <text x="270" y="79">I</text>
    <text x="321" y="130">II</text>
    <text x="340" y="200">III</text>
    <text x="321" y="270">IV</text>
    <text x="270" y="321">V</text>
    <text x="200" y="340">VI</text>
    <text x="130" y="321">VII</text>
    <text x="79" y="270">VIII</text>
    <text x="60" y="200">IX</text>
    <text x="79" y="130">X</text>
    <text x="130" y="79">XI</text>
    <text x="200" y="60">XII</text>
  </g>

  <!-- 中心点 -->
  <circle cx="200" cy="200" r="6" fill="#5c3a1e"/>
</svg>
